<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAL Demo</title>
<style>
  :root { --bg: #f5f5f7; --surface: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #0071e3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; --surface: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --line: #38383a; --accent: #0a84ff; } }
  :root[data-theme="dark"] { --bg: #000; --surface: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --line: #38383a; --accent: #0a84ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  h1 { font-size: 20px; margin: 0; } .muted { color: var(--muted); } .grow { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { min-height: 38px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:active { opacity: .7; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-auto-rows: 80vh; } }
  .pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .pane h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 10px 16px 0; }
  iframe { flex: 1; width: 100%; border: 0; min-height: 0; }
</style>
</head>
<body>
<header>
  <h1>SAL</h1><span class="muted">Safe After Leaving · the same conversation on two screens</span>
  <span class="grow"></span>
  <div class="seg" id="who" role="group" aria-label="Made-up client">
    <button data-sc="C01" data-lang="en" aria-pressed="true" title="Leaving Friday, walker, no ID">Ray</button>
    <button data-sc="C02" data-lang="es" aria-pressed="false" title="Wants a small loan, Spanish">Marisol</button>
    <button data-sc="C03" data-lang="en" aria-pressed="false" title="Sister in Phoenix, no money for the trip">Devon</button>
    <button data-sc="C10" data-lang="en" aria-pressed="false" title="Not safe to go back">Lena</button>
  </div>
  <div class="seg" id="voice" role="group" aria-label="Voice">
    <button data-v="grok" aria-pressed="true">Voices on</button><button data-v="off" aria-pressed="false">Silent</button>
  </div>
  <button class="btn primary" id="play">Play</button>
  <button class="btn" id="stop">Stop</button>
</header>
<main>
  <section class="pane"><h2>Client's tablet</h2><iframe id="client" src="/?view=client&embed=1" title="Client's tablet" allow="autoplay; microphone"></iframe></section>
  <section class="pane"><h2>Case manager's screen</h2><iframe id="staff" src="/?view=staff&embed=1" title="Case manager's screen"></iframe></section>
</main>
<script>
let sc = "C01", lang = "en", voice = "grok";
const client = document.getElementById("client").contentWindow;
document.querySelectorAll("#who button").forEach(b => b.onclick = () => {
  sc = b.dataset.sc; lang = b.dataset.lang;
  document.querySelectorAll("#who button").forEach(x => x.setAttribute("aria-pressed", x === b));
});
document.querySelectorAll("#voice button").forEach(b => b.onclick = () => {
  voice = b.dataset.v; client.postMessage({ type: "voice", voice }, location.origin);
  document.querySelectorAll("#voice button").forEach(x => x.setAttribute("aria-pressed", x === b));
});
document.getElementById("play").onclick = () => { client.postMessage({ type: "voice", voice }, location.origin); client.postMessage({ type: "autoplay", scenario: sc, lang }, location.origin); };
document.getElementById("stop").onclick = () => client.postMessage({ type: "stop" }, location.origin);
</script>
</body>
</html>
